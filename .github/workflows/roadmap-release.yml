name: roadmap-release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: roadmap/package-lock.json
      - run: npm ci
        working-directory: roadmap
      - run: npm run lint
        working-directory: roadmap
      - run: npm run typecheck
        working-directory: roadmap
      - run: npm run test
        working-directory: roadmap
      - run: npm run build:hosting
        working-directory: roadmap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roadmap-prebuilt-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            roadmap/.vercel/output
            roadmap/.generated/prebuilt-manifest.json
            roadmap/.generated/public/courses/catalog.json
